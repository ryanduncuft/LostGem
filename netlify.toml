# =========================================================================
# PRIMARY REDIRECT RULES (Prioritized 301 Permanent Redirects)
# =========================================================================

[[redirects]]
  # Rule 1: Redirect old Netlify subdomain to the canonical domain
  from = "https://ryzethakidd.netlify.app/*"
  to = "https://www.ryzethakidd.com/:splat"
  status = 301
  force = true

[[redirects]]
  # Rule 2: Redirect HTTP (all domains) to secure HTTPS
  from = "http://*"
  to = "https://www.ryzethakidd.com/:splat"
  status = 301
  force = true

# =========================================================================
# REWRITE RULES (Modified for "Ugly" Single/Album URLs)
# =========================================================================

[[redirects]]
  # EXCLUSION: If the path is /single or /album exactly, do NOT rewrite to .html.
  # This forces the server to look for a folder instead of the file, making /single 404
  # and requiring /single.html
  from = "/single"
  to = "/single"
  status = 200

[[redirects]]
  from = "/album"
  to = "/album"
  status = 200

[[redirects]]
  # Rule 3: Clean URLs for OTHER static pages (about, contact, etc)
  from = "/:page"
  to = "/:page.html"
  status = 200

[[redirects]]
  # Rule 6: Custom 404 Page
  from = "/*"
  to = "/404.html"
  status = 404

# =========================================================================
# SECURITY HEADERS
# =========================================================================

[[headers]]
  for = "/*"
  [headers.values]
    # Prevents clickjacking by forbidding your site from being embedded in frames
    X-Frame-Options = "DENY"
    # Prevents MIME-type sniffing attacks
    X-Content-Type-Options = "nosniff"
    # Protects user privacy when navigating away
    Referrer-Policy = "strict-origin-when-cross-origin"
     
    # Updated Content Security Policy whitelisting your CDN for styles and cdnjs for source maps
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' https://js.stripe.com https://cdn.ryzethakidd.com https://cdnjs.cloudflare.com https://gist.github.com 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.ryzethakidd.com;
      font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
      img-src 'self' data: https://*.stripe.com https://res.cloudinary.com https://cdn.ryzethakidd.com https://*.ytimg.com https://salehriaz.com https://gist.githubusercontent.com;
      connect-src 'self' https://api.stripe.com https://res.cloudinary.com https://cdn.ryzethakidd.com https://cdnjs.cloudflare.com https://gist.githubusercontent.com;
      frame-src https://js.stripe.com https://www.youtube.com https://www.youtube-nocookie.com;
    """
